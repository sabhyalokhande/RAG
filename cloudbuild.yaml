steps:
  # Build the container image
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/rag-app:$COMMIT_SHA', '.']
  
  # Push the container image to Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/rag-app:$COMMIT_SHA']
  
  # Tag the image with 'latest'
  - name: 'gcr.io/cloud-builders/docker'
    args: ['tag', 'gcr.io/$PROJECT_ID/rag-app:$COMMIT_SHA', 'gcr.io/$PROJECT_ID/rag-app:latest']
  
  # Push the 'latest' tag
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/rag-app:latest']

# Store images in Google Container Registry
images:
  - 'gcr.io/$PROJECT_ID/rag-app:$COMMIT_SHA'
  - 'gcr.io/$PROJECT_ID/rag-app:latest'

# Build timeout
timeout: '1200s' 